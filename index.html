<!DOCTYPE html>
<!--
  ============================================================
  FC Sirius 戦績マップ (U7 26年度)
  Revision : 1
  Updated  : 2026-09-11
  ============================================================
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FC sirius戦績マップ（非公式）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F7F6F2;
    --panel:#FFFFFF;
    --ink:#1F2933;
    --ink-soft:#5A6472;
    --line:#DDD8CB;
    --accent:#C1440E;
    --accent-soft:#F3D9CB;
    --blue:#2B6CB0;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--paper);
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh; /* iOS Safari address-bar resize fix */
    overflow:hidden;
  }
  .load-error{
    padding:24px;
    font-size:13px;
    color:var(--accent);
    line-height:1.6;
  }

  header{
    display:flex;
    align-items:center;
    flex-wrap:nowrap;
    gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    z-index:20;
  }
  header h1{
    font-size:15px;
    font-weight:700;
    letter-spacing:.02em;
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-width:0;
  }
  .header-right{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:1;
    min-width:0;
    max-width:58%;
  }
  header .count{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink-soft);
    white-space:nowrap;
    flex-shrink:1;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .header-toggle{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-size:11px;
    border-radius:4px;
    padding:3px 8px;
    cursor:pointer;
    flex-shrink:0;
  }
  #gradeSelect{
    max-width:84px;
    box-sizing:border-box;
  }
  .header-toggle:hover{ background:var(--paper); }

  .legend-bar{
    display:flex;
    flex-wrap:wrap;
    gap:6px 18px;
    padding:8px 20px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    z-index:20;
  }
  .legend-item{
    display:flex;
    align-items:baseline;
    gap:6px;
    font-size:11.5px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .legend-item[data-filter]{
    cursor:pointer;
    padding:3px 8px;
    border-radius:99px;
    border:1px solid transparent;
    transition:background .12s, border-color .12s;
  }
  .legend-item[data-filter]:hover{
    background:var(--panel);
    border-color:var(--line);
  }
  .legend-item[data-filter].active-filter{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .legend-item b{
    color:var(--ink);
    font-weight:700;
  }
  .legend-item .lcount{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:3px;
    padding:0 5px;
  }

  .layout{
    flex:1;
    display:flex;
    min-height:0;
  }

  .map-wrap{
    flex:1;
    min-height:0;
    position:relative;
    width:100%;
  }

  .section{
    padding:16px 18px;
    border-bottom:1px solid var(--line);
  }
  .section-title{
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 10px 0;
  }
  .section-title.collapsible{
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    user-select:none;
    margin:0;
    padding-bottom:10px;
  }
  .section-title.collapsible .chev{
    font-size:10px;
    transition:transform .15s ease;
  }
  .collapsible-body{
    overflow:hidden;
  }
  .collapsible-body.collapsed{
    display:none;
  }

  /* add point form */
  .row{ display:flex; gap:8px; margin-bottom:8px; }
  .row input{ flex:1; min-width:0; }
  label.field{
    display:block;
    font-size:10px;
    color:var(--ink-soft);
    margin-bottom:3px;
    font-family:var(--mono);
  }
  input[type=text], input[type=number]{
    width:100%;
    padding:7px 8px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:13px;
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
  }
  input:focus{ outline:2px solid var(--blue); outline-offset:-1px; }

  .btn{
    appearance:none;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    font-size:12.5px;
    font-weight:600;
    padding:8px 12px;
    border-radius:4px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .btn:hover{ background:var(--paper); }
  .btn:focus-visible{ outline:2px solid var(--blue); outline-offset:1px; }
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn-primary:hover{ background:#a83a0c; }
  .btn-primary.active{
    background:#8f3309;
    box-shadow: inset 0 0 0 2px #ffffff55;
  }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); padding:6px 8px;}
  .btn-ghost:hover{ background:var(--paper); color:var(--ink); }
  .btn-block{ width:100%; justify-content:center; }
  .btn-sm{ padding:6px 10px; font-size:11px; min-height:30px; }

  .hint{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:6px;
    line-height:1.5;
  }

  /* layer switcher */
  .pillgroup{ display:flex; gap:6px; flex-wrap:wrap; }
  .pill{
    font-size:12px;
    padding:8px 12px;
    border-radius:99px;
    border:1px solid var(--line);
    background:var(--paper);
    cursor:pointer;
    color:var(--ink-soft);
  }
  .pill.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
    font-weight:600;
  }

  /* points list */
  .list-wrap{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  .list-scroll{
    flex:1;
    overflow-y:auto;
    padding:6px 10px calc(14px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch;
  }
  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:12.5px;
    padding:26px 10px;
    line-height:1.6;
  }
  .list-group-title{
    font-size:11px;
    font-weight:700;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin:12px 4px 4px;
  }
  .list-group-title:first-child{ margin-top:2px; }
  .point-card{
    border:1px solid var(--line);
    border-radius:6px;
    margin:6px 2px;
    background:var(--panel);
    overflow:hidden;
  }
  .point-card.selected{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .point-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    cursor:pointer;
  }
  .swatch{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    flex-shrink:0;
  }
  .point-name{
    font-size:13px;
    font-weight:600;
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .point-coords{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
    padding:0 10px 8px 28px;
  }
  .point-actions{
    display:flex;
    gap:4px;
    padding:0 8px 8px 28px;
  }
  .point-edit{
    padding:8px 10px 10px;
    background:var(--paper);
    border-top:1px solid var(--line);
    display:none;
  }
  .point-edit.open{ display:block; }
  .point-edit .row{ margin-bottom:6px; }
  .point-edit .row:last-child{ margin-bottom:0; margin-top:8px; justify-content:flex-end; }

  .badge{
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-soft);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:3px;
    padding:1px 5px;
    flex-shrink:0;
  }

  .match-section{
    margin-top:10px;
    padding-top:8px;
    border-top:1px solid var(--line);
  }
  .match-section .section-title{ margin-bottom:6px; }
  .match-list{
    max-height:150px;
    overflow-y:auto;
    margin-bottom:6px;
  }
  .match-row{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    padding:4px 2px;
    border-bottom:1px dashed var(--line);
  }
  .match-row:last-child{ border-bottom:none; }
  .match-row span{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .match-row .mscore{ font-family:var(--mono); flex:0 0 auto; }
  .match-row .mresult{ flex:0 0 auto; font-weight:700; }
  .match-empty{ font-size:11.5px; color:var(--ink-soft); padding:4px 2px; }
  select{
    width:100%;
    padding:7px 8px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:13px;
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
  }

  /* import/export */
  textarea{
    width:100%;
    min-height:70px;
    resize:vertical;
    font-family:var(--mono);
    font-size:11.5px;
    padding:8px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--paper);
    color:var(--ink);
  }
  .io-actions{ display:flex; gap:8px; margin-top:8px; }
  .io-actions .btn{ flex:1; }

  /* ---------- map ---------- */
  #map{ width:100%; height:100%; background:#e8e6de; min-width:0; }

  .leaflet-popup-content{ font-family:var(--sans); font-size:13px; }
  .leaflet-popup-content b{ display:block; margin-bottom:2px; }
  .leaflet-popup-content .pcoord{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); }
  .leaflet-popup-content .precord{
    max-height:130px;
    overflow-y:auto;
    margin-top:6px;
  }
  .leaflet-popup-content .precord-title{ font-weight:700; font-size:11.5px; margin-bottom:2px; }
  .leaflet-popup-content .precord-row{
    display:flex;
    justify-content:space-between;
    gap:8px;
    font-size:11px;
    padding:2px 0;
    border-top:1px solid #eee;
  }
  .leaflet-popup-content .precord-row .pmono{ font-family:var(--mono); }

  .click-banner{
    position:absolute;
    top:12px; left:50%;
    transform:translateX(-50%);
    background:var(--accent);
    color:#fff;
    font-size:12.5px;
    font-weight:600;
    padding:7px 16px;
    border-radius:99px;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
    z-index:1000;
    display:none;
    align-items:center;
    gap:8px;
  }
  .click-banner.show{ display:flex; }

  /* ---------- unified floating map controls ---------- */
  .map-controls{
    position:absolute;
    top:8px;
    right:8px;
    z-index:1000;
    display:flex;
    flex-direction:column;
    gap:4px;
    width:100px;
  }
  .map-ctrl-btn{
    display:flex;
    align-items:center;
    gap:5px;
    width:100%;
    box-sizing:border-box;
    padding:6px 8px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    font-size:11px;
    font-weight:600;
    font-family:var(--sans);
    text-align:left;
    line-height:1.2;
    box-shadow:0 2px 5px rgba(0,0,0,.16);
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .map-ctrl-btn .ico{
    flex-shrink:0;
    font-size:12px;
    width:14px;
    text-align:center;
  }
  .map-ctrl-btn:active{ transform:scale(0.97); }
  .map-ctrl-btn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }

  .leaflet-tooltip.name-label{
    display:none;
    background:rgba(255,255,255,.92);
    border:1px solid var(--line);
    border-radius:3px;
    padding:1px 6px;
    font-size:10.5px;
    font-family:var(--sans);
    color:var(--ink);
    box-shadow:0 1px 2px rgba(0,0,0,.15);
    white-space:nowrap;
  }
  .leaflet-tooltip.name-label::before{ display:none; }
  body.team-labels-visible .leaflet-tooltip.name-label.team-label{ display:block; }
  body.ground-labels-visible .leaflet-tooltip.name-label.ground-label{ display:block; }

  @media (max-width: 380px){
    .map-controls{ width:86px; }
    .map-ctrl-btn{ font-size:10px; padding:5px 6px; }
    .map-ctrl-btn .ico{ font-size:11px; width:12px; }
  }

  .toast{
    position:absolute;
    bottom:16px; left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    font-size:12.5px;
    padding:8px 16px;
    border-radius:6px;
    z-index:1000;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .toast.show{ opacity:1; }

  /* scrollbar */
  .list-scroll::-webkit-scrollbar{ width:8px; }
  .list-scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  /* very narrow phones: keep header compact and on one line */
  @media (max-width: 380px){
    header h1{ font-size:13px; }
    .header-right{ gap:4px; }
    header .count{ font-size:10.5px; }
    #gradeSelect{ font-size:10.5px; padding:3px 4px; max-width:64px; }
    .header-toggle{ font-size:10px; padding:3px 6px; }
  }
</style>
</head>
<body>

<header>
  <h1>FC sirius戦績マップ（非公式）</h1>
  <div class="header-right">
    <span class="count" id="countLabel">0 地点</span>
    <select id="gradeSelect" class="header-toggle" style="cursor:pointer;"></select>
  </div>
</header>

<div class="collapsible-body collapsed" id="legendBody">
<div class="legend-bar">
  <span class="legend-item" data-filter="green">🟢 勝率100%（全勝）</span>
  <span class="legend-item" data-filter="yellow">🟡 勝率60%〜99%</span>
  <span class="legend-item" data-filter="orange">🟠 勝率30%〜59%</span>
  <span class="legend-item" data-filter="red">🔴 勝率30%未満</span>
  <span class="legend-item" data-filter="skull">💀 全敗（勝ちなし・分けなし）</span>
  <span class="legend-item"><span style="display:inline-block;width:11px;height:11px;background:#1B4B66;border-radius:3px;vertical-align:-1px;"></span> ⚽ グラウンド（試合会場）</span>
</div>
</div>

<div class="layout">
  

  <div class="map-wrap">
    <div class="map-controls">
      <button class="map-ctrl-btn" id="btnCycleTileLayer" title="背景地図の切替"><span class="ico">🗺️</span><span class="lbl">淡色地図</span></button>
      <button class="map-ctrl-btn" id="btnToggleTeamLabels" title="チーム名の表示/非表示"><span class="ico">🏷️</span><span class="lbl">チーム名</span></button>
      <button class="map-ctrl-btn active" id="btnToggleGroundsVisible" title="グラウンドの表示/非表示"><span class="ico">⚽</span><span class="lbl">グラウンド</span></button>
      <button class="map-ctrl-btn" id="btnToggleGroundLabels" title="グラウンド名の表示/非表示"><span class="ico">🚩</span><span class="lbl">会場名</span></button>
      <button class="map-ctrl-btn" id="btnHeaderToggle" data-collapse-toggle data-target="legendBody" title="凡例の表示/非表示"><span class="ico">🛈</span><span class="lbl">凡例</span></button>
    </div>
    <div id="map"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
if(typeof L === 'undefined'){
  document.body.innerHTML = '<div class="load-error">地図ライブラリ(Leaflet)の読み込みに失敗しました。通信環境をご確認のうえ、再読み込みしてください。</div>';
  throw new Error('Leaflet failed to load from CDN');
}

/* ---------------- grade filter (学年別表示) ---------------- */
const GRADE_OPTIONS = ['U-6','U-7','U-8','U-9','U-10','U-11','U-12'];
const GRADE_LABELS = {
  'U-6':'園児(年少〜年長)', 'U-7':'1年生', 'U-8':'2年生', 'U-9':'3年生',
  'U-10':'4年生', 'U-11':'5年生', 'U-12':'6年生',
};
const GRADE_STORAGE_KEY = 'fcsirius_grade';

function loadSavedGrade(){
  try{
    const g = localStorage.getItem(GRADE_STORAGE_KEY);
    return GRADE_OPTIONS.includes(g) ? g : 'U-7';
  }catch(e){ return 'U-7'; }
}
function saveGrade(g){
  try{ localStorage.setItem(GRADE_STORAGE_KEY, g); }catch(e){ /* ignore */ }
}
let currentGrade = loadSavedGrade();

function matchesForGrade(matches){
  return (matches||[]).filter(m => (m.category||'').trim() === currentGrade);
}

/* ---------------- state ---------------- */
let points = [];        // {id, name, lat, lng}
let markers = {};        // id -> leaflet marker
let nextId = 1;
let clickModeOn = false;
let selectedId = null;
let expandedEdit = new Set();
const STORAGE_KEY = 'gsi_plotter_points';

/* ---------------- map setup ---------------- */
const map = L.map('map', { zoomControl: true }).setView([35.15, 137.03], 10); // Aichi default

const tileDefs = {
  std:   { url: 'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', maxZoom: 18, attribution: null },
  pale:  { url: 'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', maxZoom: 18, attribution: null },
  photo: { url: 'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', maxZoom: 18, attribution: null },
  blank: { url: 'https://cyberjapandata.gsi.go.jp/xyz/blank/{z}/{x}/{y}.png', maxZoom: 18, attribution: null },
};
const gsiAttribution = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>（国土地理院）';

function makeTileLayer(key){
  const def = tileDefs[key];
  return L.tileLayer(def.url, { maxZoom: def.maxZoom, attribution: def.attribution || gsiAttribution });
}

let currentTile = makeTileLayer('pale').addTo(map);

/* ---------------- grounds (試合会場) ---------------- */
// シートの「場所」列に対応する座標。判明分は実測住所ベース、それ以外は概算。
const GROUND_COORDS = {
  '木曽川運動場G': [35.3368, 136.7905],
  'ひかりグランド': [35.2979, 137.0190],
  '碧南2号地運動広場G': [34.849942, 136.966471],
  '豊明市大原公園G': [35.045812, 136.985078],
  '若園運動広場G': [35.015472, 137.091038],
  '池浦西公園G': [34.966200, 137.073481],
  'WACTIVA ANJOグランド(人工芝)': [34.971714, 137.092995],
  'はままつフルーツパーク時之栖G': [34.841850, 137.730888],
  '中部大学スポーツパーク日進G': [35.1280, 137.0380],
  'まるはスポーツパークG': [34.860573, 136.898262],
  '豊田市五ケ丘運動公園G': [35.061123, 137.197635],
  '尾張旭市旭ケ丘G': [35.229034, 137.040721],
  '愛知県森林公園運動広場G': [35.231903, 137.054734],
  '半田ぴよログスポーツパークG': [34.899479, 136.884034],
  '守山多目的グランド': [35.228050, 137.019066],
  '日進総合公園スポーツ広場G': [35.147560, 137.071901],
  '一宮市立小信中島小学校': [35.3100, 136.7500],
};

let grounds = {};        // name -> {name, lat, lng, matches:[]}
let groundMarkers = {};  // name -> leaflet marker
let groundsVisible = true;
const GROUND_COLOR = '#1B4B66'; // 淡色地図の背景でも視認しやすい濃紺

function groundIcon(){
  return L.divIcon({
    className: '',
    html: `<div style="width:22px;height:22px;border-radius:5px;background:${GROUND_COLOR};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:12px;">⚽</div>`,
    iconSize: [22,22],
    iconAnchor: [11,11],
  });
}

// Apps Scriptウェブアプリのデプロイ後URL(書き込み用)。設定するまではローカル保存のみで動作します。
const GROUND_MEMO_WRITE_URL = 'https://script.google.com/macros/s/AKfycbwo1C-XsWwk8l1JRMe0yyWR9jQzVyCoURTiEjzKKCuLM9O775H9vWouCRKoZQNINnfWhA/exec';
// grounds_memo タブを「ウェブに公開」したCSV URL(読み込み用)。設定するまでは自分のブラウザのメモのみ表示されます。
const GROUND_MEMO_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTEA-Qh6qyA6ODIbsqqYmWh7AfABhhpJbpXLi571XVoj86uHFJaWgDYt3vbVKOm9gO3Y9i5Vxjqesub/pub?gid=1404825293&single=true&output=csv';

let groundMemoCache = {}; // name -> memo (Google Sheetsから読み込んだ値)

async function loadGroundMemosFromSheet(){
  if(!GROUND_MEMO_CSV_URL) return;
  try{
    const res = await fetch(GROUND_MEMO_CSV_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    const headerIdx = rows.findIndex(r => r.map(c=>String(c).trim()).includes('ground'));
    if(headerIdx === -1) return;
    const header = rows[headerIdx].map(c=>String(c).trim());
    const iGround = header.indexOf('ground');
    const iMemo = header.indexOf('memo');
    for(let i=headerIdx+1;i<rows.length;i++){
      const r = rows[i];
      if(!r || !r[iGround] || !String(r[iGround]).trim()) continue;
      groundMemoCache[String(r[iGround]).trim()] = iMemo>=0 ? String(r[iMemo]||'') : '';
    }
  }catch(err){
    console.error('ground memo sheet fetch failed', err);
  }
}

function groundMemoKey(name){ return 'ground_memo_' + name; }
function getGroundMemo(name){
  if(groundMemoCache[name] !== undefined) return groundMemoCache[name];
  try{ return localStorage.getItem(groundMemoKey(name)) || ''; }catch(e){ return ''; }
}
async function setGroundMemo(name, text){
  groundMemoCache[name] = text;
  try{ localStorage.setItem(groundMemoKey(name), text); }catch(e){ /* ignore */ }
  if(!GROUND_MEMO_WRITE_URL) return true; // Sheets未設定の場合はローカル保存のみ
  try{
    await fetch(GROUND_MEMO_WRITE_URL, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ ground:name, memo:text })
    });
    return true;
  }catch(err){
    console.error('ground memo write failed', err);
    return false;
  }
}

function groundPopupHtml(g){
  const matches = matchesForGrade(g.matches);
  const rows = matches.slice()
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''))
    .map(m=>`<div class="precord-row">
        <span>${escapeHtml(m.date||'')}${m.category ? ' '+escapeHtml(m.category) : ''}</span>
        <span class="pmono">vs ${escapeHtml(m.opponent||'')}</span>
        <span>${escapeHtml(m.score||'')} ${escapeHtml(m.result||'')}</span>
      </div>`).join('');
  const memo = escapeHtml(getGroundMemo(g.name));
  return `<b>⚽ ${escapeHtml(g.name)}</b>
    <div class="precord">
      <div class="precord-title">試合実績 ${matches.length}件（${escapeHtml(GRADE_LABELS[currentGrade]||currentGrade)}）</div>
      ${rows || '<div style="font-size:11px;color:#5A6472;">記録なし</div>'}
    </div>
    <div style="margin-top:8px;">
      <textarea class="ground-memo-input" data-ground="${escapeHtml(g.name)}" placeholder="メモ（駐車場・アクセスなど）" style="width:100%;min-height:50px;font-size:11px;padding:5px;border:1px solid #DDD8CB;border-radius:4px;box-sizing:border-box;">${memo}</textarea>
      <button class="btn btn-sm btn-primary" data-act="save-ground-memo" style="margin-top:4px;width:100%;">メモを保存</button>
    </div>`;
}

function groundHasCurrentGradeMatches(g){
  return matchesForGrade(g.matches).length > 0;
}

function applyGroundGradeFilter(){
  Object.values(grounds).forEach(g=>{
    const marker = groundMarkers[g.name];
    if(!marker) return;
    const shouldShow = groundsVisible && groundHasCurrentGradeMatches(g);
    const onMap = map.hasLayer(marker);
    if(shouldShow && !onMap) marker.addTo(map);
    if(!shouldShow && onMap) map.removeLayer(marker);
  });
}

function renderGroundMarker(g){
  const marker = L.marker([g.lat, g.lng], { icon: groundIcon() });
  marker.bindPopup(groundPopupHtml(g), { maxWidth: 260 });
  marker.bindTooltip(g.name, { permanent:true, direction:'top', offset:[0,-12], className:'name-label ground-label' });
  marker.on('popupopen', (e)=>{
    const container = e.popup.getElement();
    const btn = container.querySelector('[data-act="save-ground-memo"]');
    const ta = container.querySelector('.ground-memo-input');
    if(btn && ta){
      btn.addEventListener('click', async ()=>{
        btn.disabled = true;
        btn.textContent = '保存中…';
        const ok = await setGroundMemo(g.name, ta.value);
        btn.disabled = false;
        btn.textContent = 'メモを保存';
        toast(ok ? 'メモを保存しました' : 'メモの保存に失敗しました');
      });
    }
  });
  if(groundsVisible && groundHasCurrentGradeMatches(g)) marker.addTo(map);
  groundMarkers[g.name] = marker;
}

function upsertGroundMatch(placeName, info){
  const coords = GROUND_COORDS[placeName];
  if(!coords) return false;
  if(!grounds[placeName]){
    grounds[placeName] = { name: placeName, lat: coords[0], lng: coords[1], matches: [] };
  }
  const g = grounds[placeName];
  const key = [info.date, info.opponent, info.score, info.result].join('|');
  if(g.matches.some(m => [m.date,m.opponent,m.score,m.result].join('|') === key)) return true;
  g.matches.push(info);
  return true;
}

function refreshGroundMarkers(){
  Object.values(groundMarkers).forEach(m=> map.removeLayer(m));
  groundMarkers = {};
  Object.values(grounds).forEach(g=> renderGroundMarker(g));
}

/* ---------------- keep map sized correctly (fixes blank map on mobile) ---------------- */

/* ---------------- separate markers sharing (near-)identical coordinates ---------------- */
function deconflictCoordinates(list){
  const groups = {};
  list.forEach(it=>{
    const key = it.lat.toFixed(3) + ',' + it.lng.toFixed(3);
    (groups[key] = groups[key] || []).push(it);
  });
  Object.values(groups).forEach(group=>{
    const n = group.length;
    if(n <= 1) return;
    const radius = 0.0045; // ~500m: enough to separate visually at city-level zoom
    group.forEach((it, i)=>{
      const angle = (2*Math.PI*i)/n;
      const latRad = it.lat * Math.PI/180;
      it.lat = it.lat + radius*Math.cos(angle);
      it.lng = it.lng + radius*Math.sin(angle)/Math.cos(latRad);
    });
  });
}

/* ---------------- avoid overlapping name labels ---------------- */
let declutterTimer = null;
function declutterLabels(){
  const showTeam = document.body.classList.contains('team-labels-visible');
  const showGround = document.body.classList.contains('ground-labels-visible');
  if(!showTeam && !showGround) return;

  const entries = [];
  if(showTeam){
    points.forEach(p=>{
      const m = markers[p.id];
      if(m) entries.push({ marker:m, lat:p.lat, lng:p.lng, name:p.name, cls:'name-label team-label' });
    });
  }
  if(showGround){
    Object.values(grounds).forEach(g=>{
      const m = groundMarkers[g.name];
      if(m) entries.push({ marker:m, lat:g.lat, lng:g.lng, name:g.name, cls:'name-label ground-label' });
    });
  }
  if(entries.length===0) return;

  entries.forEach(e=>{
    const pt = map.latLngToContainerPoint([e.lat, e.lng]);
    e.x = pt.x; e.y = pt.y;
  });
  // stable placement order: top-to-bottom, then left-to-right
  entries.sort((a,b)=> (a.y - b.y) || (a.x - b.x));

  const CELL_W = 60, CELL_H = 16;
  const cellCounts = {};
  entries.forEach(e=>{
    const key = Math.round(e.x / CELL_W) + '_' + Math.round(e.y / CELL_H);
    const n = cellCounts[key] || 0;
    cellCounts[key] = n + 1;
    const offsetY = -10 - (14 * n); // stack further labels progressively higher
    const tt = e.marker.getTooltip && e.marker.getTooltip();
    const currentOffsetY = (tt && tt.options && tt.options.offset) ? tt.options.offset[1] : null;
    if(currentOffsetY !== offsetY){
      e.marker.unbindTooltip();
      e.marker.bindTooltip(e.name, { permanent:true, direction:'top', offset:[0, offsetY], className: e.cls });
    }
  });
}
function scheduleDeclutter(){
  clearTimeout(declutterTimer);
  declutterTimer = setTimeout(declutterLabels, 120);
}
map.on('zoomend', scheduleDeclutter);
map.on('moveend', scheduleDeclutter);

/* ---------------- persistence ---------------- */
async function loadPersisted(){
  if(!window.storage){ return; }
  try{
    const res = await window.storage.get(STORAGE_KEY);
    if(res && res.value){
      const saved = JSON.parse(res.value);
      if(Array.isArray(saved)){
        points = saved;
        nextId = points.reduce((m,p)=>Math.max(m,p.id),0) + 1;
      }
    }
  }catch(e){ /* no saved data yet */ }
}
let persistFailedNotified = false;
async function persist(){
  if(!window.storage){ return; }
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(points));
  }catch(e){
    console.error('storage save failed', e);
    if(!persistFailedNotified){
      persistFailedNotified = true;
      toast('自動保存でエラー発生。作業は継続できます。念のためCSV書出で保存してください');
    }
  }
}

/* ---------------- toast ---------------- */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
}

/* ---------------- accuracy grade -> color (used only for note text, no longer for icon color) ---------------- */
function extractGrade(note){
  if(!note) return null;
  const m = note.match(/精度([A-D])/);
  return m ? m[1] : null;
}

/* ---------------- win-rate -> color / skull ---------------- */
function teamVisual(matches){
  const s = recordSummary(matches);
  if(s.total===0) return { color:'#9CA3AF', skull:false, rate:null, ...s };
  const allLoss = (s.win===0 && s.draw===0 && s.lose===s.total);
  if(allLoss) return { color:'#1F2933', skull:true, rate:0, ...s };
  const rate = (s.win / s.total) * 100;
  let color;
  if(rate >= 100) color = '#22C55E';       // 緑: 勝率100%
  else if(rate >= 60) color = '#EAB308';   // 黄: 60-99%
  else if(rate >= 30) color = '#F97316';   // 橙: 30-59%
  else color = '#EF4444';                  // 赤: 30%未満
  return { color, skull:false, rate, ...s };
}

// 凡例クリックによる絞り込み用: 勝率カテゴリを1語のラベルに分類
function teamCategory(matches){
  const v = teamVisual(matches);
  if(v.rate === null) return null; // 戦績データなし（絞り込み対象外）
  if(v.skull) return 'skull';
  if(v.rate >= 100) return 'green';
  if(v.rate >= 60) return 'yellow';
  if(v.rate >= 30) return 'orange';
  return 'red';
}

let activeTeamFilter = null; // 'green'|'yellow'|'orange'|'red'|'skull'|null

function applyTeamFilter(){
  points.forEach(p=>{
    const marker = markers[p.id];
    if(!marker) return;
    const cat = teamCategory(p.matches);
    const show = !activeTeamFilter || cat === activeTeamFilter;
    const onMap = map.hasLayer(marker);
    if(show && !onMap) marker.addTo(map);
    if(!show && onMap) map.removeLayer(marker);
  });
}

/* ---------------- marker icon ---------------- */
function makeIcon(active, color, skull){
  const ring = active ? '0 0 0 3px #1F2933, 0 1px 4px rgba(0,0,0,.4)' : '0 1px 4px rgba(0,0,0,.4)';
  if(skull){
    return L.divIcon({
      className: '',
      html: `<div style="width:20px;height:20px;border-radius:50%;background:#1F2933;border:2px solid #fff;box-shadow:${ring};display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;">💀</div>`,
      iconSize: [20,20],
      iconAnchor: [10,10],
    });
  }
  return L.divIcon({
    className: '',
    html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:${ring};"></div>`,
    iconSize: [16,16],
    iconAnchor: [8,8],
  });
}

/* ---------------- core operations ---------------- */
function addPoint(name, lat, lng, {fly=false, note='', matches=[], silent=false, url=''} = {}){
  lat = Number(lat); lng = Number(lng);
  if(Number.isNaN(lat) || Number.isNaN(lng)){ toast('緯度・経度が不正です'); return null; }
  const p = { id: nextId++, name: name && name.trim() ? name.trim() : `地点${nextId-1}`, lat, lng, note: note || '', matches: matches || [], url: url || '' };
  points.push(p);
  renderMarker(p);
  if(!silent){
    renderList();
    persist();
    if(fly) map.flyTo([lat,lng], Math.max(map.getZoom(), 14));
  }
  return p;
}

/* ---------------- match records (戦績) ---------------- */
function recordSummary(matches){
  const filtered = matchesForGrade(matches);
  const s = { win:0, draw:0, lose:0, total: filtered.length };
  filtered.forEach(m=>{
    if(m.result==='勝') s.win++;
    else if(m.result==='分') s.draw++;
    else if(m.result==='敗') s.lose++;
  });
  return s;
}

function addMatch(pointId, match, {silent=false} = {}){
  const p = points.find(pp=>pp.id===pointId);
  if(!p) return null;
  if(!p.matches) p.matches = [];
  const full = { id: 'm'+Date.now()+Math.random().toString(36).slice(2,6), date:'', category:'', score:'', result:'', ...match };
  p.matches.push(full);
  if(!silent){
    const marker = markers[pointId];
    if(marker){
      marker.setPopupContent(popupHtml(p));
      const v = teamVisual(p.matches);
      marker.setIcon(makeIcon(pointId===selectedId, v.color, v.skull));
    }
    renderList();
    persist();
  }
  return full;
}

function removeMatch(pointId, matchId){
  const p = points.find(pp=>pp.id===pointId);
  if(!p) return;
  p.matches = (p.matches||[]).filter(m=>m.id!==matchId);
  const marker = markers[pointId];
  if(marker){
    marker.setPopupContent(popupHtml(p));
    const v = teamVisual(p.matches);
    marker.setIcon(makeIcon(pointId===selectedId, v.color, v.skull));
  }
  renderList();
  persist();
}

function popupHtml(p){
  const noteLine = p.note ? `<div style="font-size:11.5px;color:#5A6472;margin-top:2px;">${escapeHtml(p.note)}</div>` : '';
  const matches = matchesForGrade(p.matches);
  let recordBlock;
  if(matches.length){
    const s = recordSummary(matches);
    const v = teamVisual(matches);
    const rows = matches.slice()
      .sort((a,b)=> (b.date||'').localeCompare(a.date||''))
      .map(m=>`<div class="precord-row">
          <span>${escapeHtml(m.date||'')}${m.category ? ' ' + escapeHtml(m.category) : ''}</span>
          <span class="pmono">${escapeHtml(m.score||'')}</span>
          <span>${escapeHtml(m.result||'')}</span>
        </div>`).join('');
    const rateText = v.skull ? '全敗 💀' : `勝率${Math.round(v.rate)}%`;
    recordBlock = `<div class="precord">
        <div class="precord-title">戦績（${escapeHtml(GRADE_LABELS[currentGrade]||currentGrade)}）: ${s.win}勝${s.draw}分${s.lose}敗（${rateText}）</div>
        ${rows}
      </div>`;
  } else {
    recordBlock = `<div class="precord"><div style="font-size:11px;color:#5A6472;">${escapeHtml(GRADE_LABELS[currentGrade]||currentGrade)}の戦績データなし</div></div>`;
  }
  const linkLine = p.url ? `<div style="margin-top:6px;"><a href="${escapeHtml(p.url)}" target="_blank" rel="noopener" style="font-size:11.5px;color:#2B6CB0;">🔗 チーム紹介ページ</a></div>` : '';
  return `<b>${escapeHtml(p.name)}</b><span class="pcoord">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</span>${noteLine}${recordBlock}${linkLine}`;
}

function renderMarker(p){
  const v = teamVisual(p.matches);
  const marker = L.marker([p.lat, p.lng], { draggable:true, icon: makeIcon(p.id===selectedId, v.color, v.skull) }).addTo(map);
  marker.bindPopup(popupHtml(p), { maxWidth: 260 });
  marker.bindTooltip(p.name, { permanent:true, direction:'top', offset:[0,-10], className:'name-label team-label' });
  marker.on('dragend', ()=>{
    const ll = marker.getLatLng();
    p.lat = ll.lat; p.lng = ll.lng;
    renderList();
    persist();
    marker.setPopupContent(popupHtml(p));
  });
  marker.on('click', ()=>{ selectPoint(p.id); });
  markers[p.id] = marker;
}

function removePoint(id){
  points = points.filter(p=>p.id!==id);
  if(markers[id]){ map.removeLayer(markers[id]); delete markers[id]; }
  if(selectedId===id) selectedId = null;
  renderList();
  persist();
}

function updatePoint(id, {name, lat, lng, note, url}){
  const p = points.find(p=>p.id===id);
  if(!p) return;
  if(name!==undefined) p.name = name.trim() || p.name;
  if(lat!==undefined && !Number.isNaN(Number(lat))) p.lat = Number(lat);
  if(lng!==undefined && !Number.isNaN(Number(lng))) p.lng = Number(lng);
  if(note!==undefined) p.note = note;
  if(url!==undefined) p.url = url;
  const marker = markers[id];
  if(marker){
    marker.setLatLng([p.lat, p.lng]);
    marker.setPopupContent(popupHtml(p));
    marker.setTooltipContent(p.name);
    const v = teamVisual(p.matches);
    marker.setIcon(makeIcon(id===selectedId, v.color, v.skull));
  }
  renderList();
  persist();
}

function selectPoint(id){
  selectedId = (selectedId===id) ? null : id;
  Object.entries(markers).forEach(([mid, m])=>{
    const pt = points.find(pp=>pp.id===Number(mid));
    const v = teamVisual(pt ? pt.matches : []);

    if(p){ map.flyTo([p.lat,p.lng], Math.max(map.getZoom(),14)); markers[p.id].openPopup(); }
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const MATCHES_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTEA-Qh6qyA6ODIbsqqYmWh7AfABhhpJbpXLi571XVoj86uHFJaWgDYt3vbVKOm9gO3Y9i5Vxjqesub/pub?gid=0&single=true&output=csv';
// 全学年データ タブ（シンプル形式：team,date,category,score,result）
const ALL_GRADES_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTEA-Qh6qyA6ODIbsqqYmWh7AfABhhpJbpXLi571XVoj86uHFJaWgDYt3vbVKOm9gO3Y9i5Vxjqesub/pub?gid=1256248240&single=true&output=csv';

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = '';
        rows.push(row); row = [];
      } else field += c;
    }
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length===1 && r[0]===''));
}

async function fetchAndImportCsv(url){
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const text = await res.text();
  const rows = parseCSV(text);
  importRows(rows);
}

async function loadMatchesFromSheet({silent=false} = {}){
  let ok = true;
  if(MATCHES_CSV_URL){
    try{ await fetchAndImportCsv(MATCHES_CSV_URL); }
    catch(err){ console.error('data タブの取得に失敗', err); ok = false; }
  }
  if(ALL_GRADES_CSV_URL){
    try{ await fetchAndImportCsv(ALL_GRADES_CSV_URL); }
    catch(err){ console.error('全学年データ タブの取得に失敗', err); ok = false; }
  }
  if(!ok && !silent) toast('Google Sheetsからの読み込みに失敗しました');
  return ok;
}

/* ---------------- smart file import (Excel/CSV, points or matches) ---------------- */
const RESULT_MAP = { Win:'勝', Lose:'敗', Draw:'分', 勝:'勝', 敗:'敗', 分:'分' };

function normalizeDateStr(s){
  s = (s||'').trim();
  let m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return s;
}

function normalizeForMatch(s){
  return (s||'').replace(/\s+/g,'').toLowerCase();
}

// シート側の入力ゆれ・誤字を、地図側の正式名称に読み替えるための対応表
const TEAM_NAME_ALIASES = {
  'FC golazo goi一宮': 'FC golazo gol一宮',
};

function findTeamPoint(name){
  const clean = (name||'').trim();
  let p = points.find(pp=>pp.name.trim()===clean);
  if(!p && TEAM_NAME_ALIASES[clean]){
    const aliasTarget = TEAM_NAME_ALIASES[clean];
    p = points.find(pp=>pp.name.trim()===aliasTarget);
  }
  if(!p){
    const norm = normalizeForMatch(clean);
    p = points.find(pp=>normalizeForMatch(pp.name)===norm);
  }
  return p;
}

function matchKey(teamId, m){
  return [teamId, m.date||'', m.category||'', m.score||'', m.result||''].join('|');
}

function refreshMarkerVisual(p){
  const marker = markers[p.id];
  if(!marker) return;
  marker.setPopupContent(popupHtml(p));
  const v = teamVisual(p.matches);
  marker.setIcon(makeIcon(p.id===selectedId, v.color, v.skull));
}

// rows: array of arrays (raw cell values). Auto-detects header row & shape, then imports.
function importRows(rows){
  // find a plausible header row within the first 15 rows
  let headerIdx = -1, header = null;
  const maxScan = Math.min(rows.length, 15);
  for(let i=0;i<maxScan;i++){
    const row = (rows[i]||[]).map(c=>String(c==null?'':c).trim());
    if(row.includes('日付') && row.includes('FC名')){ headerIdx = i; header = row; break; }
    if((row.includes('name') || row.includes('名称')) && (row.includes('lat') || row.includes('緯度'))){ headerIdx = i; header = row; break; }
    if((row.includes('team') || row.includes('チーム名')) && (row.includes('date') || row.includes('日付')) && row.includes('score')){ headerIdx = i; header = row; break; }
  }
  if(headerIdx === -1){
    toast('ファイルの列構成を認識できませんでした');
    return;
  }
  const col = name => header.indexOf(name);

  if(header.includes('日付') && header.includes('FC名')){
    // 元シート形式: 日付,開始時間,終了時間,場所,引率,TM名,カテゴリ,自チームスコア,相手チームスコア,得失点,勝敗,相手チーム名,備考,FC名
    const iDate=col('日付'), iCat=col('カテゴリ'), iMy=col('自チームスコア'), iOpp=col('相手チームスコア'), iRes=col('勝敗'), iTeam=col('FC名'), iPlace=col('場所');
    let added=0, dup=0, noTeam=0; const unmatched = new Set(); const touched = new Set();
    const unmatchedPlaces = new Set();
    const existingKeys = new Set();
    points.forEach(p=> (p.matches||[]).forEach(m=> existingKeys.add(matchKey(p.id, m))));
    for(let i=headerIdx+1;i<rows.length;i++){
      const r = rows[i]||[];
      if(r.every(c=> c===undefined || c===null || String(c).trim()==='')) continue;
      const teamRaw = String(r[iTeam]==null?'':r[iTeam]).trim();
      if(!teamRaw) continue;
      const date = normalizeDateStr(String(r[iDate]==null?'':r[iDate]));
      const category = String(r[iCat]==null?'':r[iCat]).trim();
      const my = String(r[iMy]==null?'':r[iMy]).trim();
      const opp = String(r[iOpp]==null?'':r[iOpp]).trim();
      const score = (my!=='' && opp!=='') ? `${my}-${opp}` : '';
      const resultRaw = String(r[iRes]==null?'':r[iRes]).trim();
      const result = RESULT_MAP[resultRaw] || resultRaw;

      if(iPlace>=0){
        const place = String(r[iPlace]==null?'':r[iPlace]).trim();
        if(place){
          const ok = upsertGroundMatch(place, {date, category, opponent: teamRaw, score, result});
          if(!ok) unmatchedPlaces.add(place);
        }
      }

      const p = findTeamPoint(teamRaw);
      if(!p){ noTeam++; unmatched.add(teamRaw); continue; }
      const key = matchKey(p.id, {date, category, score, result});
      if(existingKeys.has(key)){ dup++; continue; }
      addMatch(p.id, {date, category, score, result}, {silent:true});
      existingKeys.add(key);
      touched.add(p.id);
      added++;
    }
    touched.forEach(id=>{ const p = points.find(pp=>pp.id===id); if(p) refreshMarkerVisual(p); });
    refreshGroundMarkers();
    renderList();
    persist();
    let msg = `戦績 ${added}件登録`;
    if(dup) msg += `／重複${dup}件スキップ`;
    if(noTeam) msg += `／該当チーム無し${noTeam}件`;
    if(unmatchedPlaces.size) msg += `／未登録グラウンド${unmatchedPlaces.size}件`;
    toast(msg);
    if(unmatched.size) console.warn('未マッチのチーム名:', [...unmatched]);
    if(unmatchedPlaces.size) console.warn('座標未登録のグラウンド:', [...unmatchedPlaces]);
    return;
  }

  if((header.includes('team') || header.includes('チーム名')) && (header.includes('date') || header.includes('日付'))){
    // シンプル形式: team/チーム名, date/日付, category/カテゴリ, score/スコア, result/結果
    const iTeam = col('team')>=0?col('team'):col('チーム名');
    const iDate = col('date')>=0?col('date'):col('日付');
    const iCat = col('category')>=0?col('category'):col('カテゴリ');
    const iScore = col('score')>=0?col('score'):col('スコア');
    const iRes = col('result')>=0?col('result'):col('結果');
    let added=0, dup=0, noTeam=0; const unmatched = new Set(); const touched = new Set();
    const existingKeys = new Set();
    points.forEach(p=> (p.matches||[]).forEach(m=> existingKeys.add(matchKey(p.id, m))));
    for(let i=headerIdx+1;i<rows.length;i++){
      const r = rows[i]||[];
      if(r.every(c=> c===undefined || c===null || String(c).trim()==='')) continue;
      const teamRaw = String(r[iTeam]==null?'':r[iTeam]).trim();
      if(!teamRaw) continue;
      const p = findTeamPoint(teamRaw);
      if(!p){ noTeam++; unmatched.add(teamRaw); continue; }
      const date = normalizeDateStr(String(r[iDate]==null?'':r[iDate]));
      const category = String(r[iCat]==null?'':r[iCat]).trim();
      const score = String(r[iScore]==null?'':r[iScore]).trim();
      const resultRaw = String(r[iRes]==null?'':r[iRes]).trim();
      const result = RESULT_MAP[resultRaw] || resultRaw;
      const key = matchKey(p.id, {date, category, score, result});
      if(existingKeys.has(key)){ dup++; continue; }
      addMatch(p.id, {date, category, score, result}, {silent:true});
      existingKeys.add(key);
      touched.add(p.id);
      added++;
    }
    touched.forEach(id=>{ const p = points.find(pp=>pp.id===id); if(p) refreshMarkerVisual(p); });
    renderList();
    persist();
    let msg = `戦績 ${added}件登録`;
    if(dup) msg += `／重複${dup}件スキップ`;
    if(noTeam) msg += `／該当チーム無し${noTeam}件`;
    toast(msg);
    if(unmatched.size) console.warn('未マッチのチーム名:', [...unmatched]);
    return;
  }

  // 拠点形式: name/名称, lat/緯度, lng/経度, note/メモ, url/リンク
  {
    const iName = col('name')>=0?col('name'):col('名称');
    const iLat = col('lat')>=0?col('lat'):col('緯度');
    const iLng = col('lng')>=0?col('lng'):col('経度');
    const iNote = col('note')>=0?col('note'):col('メモ');
    const iUrl = col('url')>=0?col('url'):(col('リンク')>=0?col('リンク'):col('link'));
    let added=0, updated=0;
    for(let i=headerIdx+1;i<rows.length;i++){
      const r = rows[i]||[];
      if(r.every(c=> c===undefined || c===null || String(c).trim()==='')) continue;
      const name = String(r[iName]==null?'':r[iName]).trim();
      if(!name) continue;
      const lat = Number(r[iLat]), lng = Number(r[iLng]);
      if(Number.isNaN(lat) || Number.isNaN(lng)) continue;
      const note = iNote>=0 ? String(r[iNote]==null?'':r[iNote]).trim() : '';
      const url = iUrl>=0 ? String(r[iUrl]==null?'':r[iUrl]).trim() : '';
      const existing = points.find(pp=>pp.name.trim()===name);
      if(existing){
        existing.lat = lat; existing.lng = lng;
        if(note) existing.note = note;
        if(url) existing.url = url;
        refreshMarkerVisual(existing);
        const marker = markers[existing.id];
        if(marker) marker.setLatLng([lat,lng]);
        updated++;
      } else {
        addPoint(name, lat, lng, {note, url, silent:true});
        added++;
      }
    }
    renderList();
    persist();
    toast(`拠点 追加${added}件／更新${updated}件`);
  }
}

  const s = recordSummary(matches);
  const isOpen = expandedEdit.has(p.id);

  const matchRowsHtml = matches.length
    ? matches.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(m=>`
        <div class="match-row">
          <span>${escapeHtml(m.date||'')}${m.category ? ' ' + escapeHtml(m.category) : ''}</span>
          <span class="mscore">${escapeHtml(m.score||'')}</span>

    ? `<span class="badge">${s.win}勝${s.draw}分${s.lose}敗${v.rate!==null ? ` ${Math.round(v.rate)}%` : ''}</span>`
    : '';

  card.innerHTML = `
    <div class="point-head" data-act="select">
      ${swatchHtml}
      <span class="point-name">${escapeHtml(p.name)}</span>
      ${badgeHtml}
      <button class="btn btn-ghost btn-sm" data-act="edit" title="編集">✎</button>
      <button class="btn btn-ghost btn-sm" data-act="del" title="削除">✕</button>

    <div class="point-coords">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div>
    ${p.note ? `<div class="point-coords" style="padding-top:0;">${escapeHtml(p.note)}</div>` : ''}
    <div class="point-edit${isOpen ? ' open' : ''}" data-edit>
      <div class="row">
        <input type="text" data-f="name" value="${escapeHtml(p.name)}">
      </div>
      <div class="row">
        <input type="number" step="any" data-f="lat" value="${p.lat}">
        <input type="number" step="any" data-f="lng" value="${p.lng}">
      </div>
      <div class="row">
        <input type="text" data-f="note" value="${escapeHtml(p.note||'')}" placeholder="所在地・精度メモ">
      </div>
      <div class="row">
        <input type="text" data-f="url" value="${escapeHtml(p.url||'')}" placeholder="チーム紹介ページURL（公式サイト/Instagram等）">
      </div>
      <div class="row">
        <button class="btn btn-primary btn-sm" data-act="save">保存</button>
      </div>

      <div class="match-section">
        <div class="section-title">戦績（${escapeHtml(GRADE_LABELS[currentGrade]||currentGrade)}のみ表示中）</div>
        <div class="match-list">${matchRowsHtml}</div>
        <div class="row">
          <input type="text" data-f="mdate" placeholder="日付 例)2026-05-10">
          <select data-f="mcat">
            ${GRADE_OPTIONS.map(g=>`<option value="${g}"${g===currentGrade?' selected':''}>${g}（${GRADE_LABELS[g]}）</option>`).join('')}
            <option value="その他">その他</option>
          </select>
        </div>
        <div class="row">
          <input type="text" data-f="mscore" placeholder="スコア 例)3-1">
          <select data-f="mresult">
            <option value="勝">勝</option>
            <option value="分">分</option>
            <option value="敗">敗</option>
          </select>
        </div>
        <div class="row">
          <button class="btn btn-sm btn-block" data-act="addmatch">戦績を追加</button>
        </div>
      </div>
    </div>
  `;

  card.querySelector('[data-act="select"]').addEventListener('click', (e)=>{
    if(e.target.closest('button')) return;
    selectPoint(p.id);
  });
  card.querySelector('[data-act="del"]').addEventListener('click', (e)=>{
    e.stopPropagation();
    removePoint(p.id);
  });
  card.querySelector('[data-act="edit"]').addEventListener('click', (e)=>{
    e.stopPropagation();
    if(expandedEdit.has(p.id)) expandedEdit.delete(p.id); else expandedEdit.add(p.id);
    renderList();
  });
  card.querySelector('[data-act="save"]').addEventListener('click', (e)=>{
    e.stopPropagation();
    const name = card.querySelector('[data-f="name"]').value;
    const lat = card.querySelector('[data-f="lat"]').value;
    const lng = card.querySelector('[data-f="lng"]').value;
    const note = card.querySelector('[data-f="note"]').value;
    const url = card.querySelector('[data-f="url"]').value;
    updatePoint(p.id, {name, lat, lng, note, url});
    toast('更新しました');
  });
  card.querySelectorAll('[data-act="delmatch"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      removeMatch(p.id, btn.dataset.mid);
    });
  });
  const addMatchBtn = card.querySelector('[data-act="addmatch"]');
  if(addMatchBtn){
    addMatchBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const date = card.querySelector('[data-f="mdate"]').value.trim();

      expandedEdit.add(p.id);
      addMatch(p.id, {date, category, score, result});
      toast('戦績を追加しました');
    });
  }

  return card;
}

function getRankedTeams(){
  const withData = points
    .filter(p => matchesForGrade(p.matches).length > 0)
    .map(p => {
      const v = teamVisual(p.matches);
      const s = recordSummary(p.matches);
      const loseRate = s.total ? (s.lose / s.total) * 100 : 0;
      return { p, v, s, loseRate };
    });

  const topWin = [...withData]
    .sort((a,b)=> b.v.rate - a.v.rate || b.s.win - a.s.win)
    .slice(0,3)
    .map(x=>x.p);

  const topWinIds = new Set(topWin.map(p=>p.id));

  const topLose = [...withData]
    .filter(x=> !topWinIds.has(x.p.id))
    .sort((a,b)=> b.loseRate - a.loseRate || b.s.lose - a.s.lose)
    .slice(0,3)
    .map(x=>x.p);

  return { topWin, topLose };
}

function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------- init ---------------- */
(async function init(){
  await loadPersisted();
  if(points.length===0){
    SEED_DATA.forEach(([name,lat,lng,note,url])=> addPoint(name, lat, lng, {note, url}));
  } else {
    points.forEach(renderMarker);
  }

  // 完全一致・近接する座標のチームを視覚的に分離
  deconflictCoordinates(points);
  points.forEach(p=>{
    const m = markers[p.id];
    if(m) m.setLatLng([p.lat, p.lng]);
  });

  // 戦績は Google Sheets(data タブ) をまず取りに行く。失敗時のみ埋め込みの
  // スナップショットデータ(SEED_MATCHES)で最低限の表示を確保する。
  const [liveOk] = await Promise.all([
    loadMatchesFromSheet({silent:true}),
    loadGroundMemosFromSheet(),
  ]);
  if(!liveOk && points.every(p=>(p.matches||[]).length===0)){
    SEED_MATCHES.forEach(([team,date,category,score,result])=>{
      const p = points.find(pp=>pp.name===team);
      if(p) addMatch(p.id, {date, category, score, result}, {silent:true});
    });
    points.forEach(p=>{
      const marker = markers[p.id];
      if(marker){
        marker.setPopupContent(popupHtml(p));
        const v = teamVisual(p.matches);
        marker.setIcon(makeIcon(p.id===selectedId, v.color, v.skull));
      }
    });
  }
  persist();
  renderList();
  fixMapSize();
  if(points.length){
    const b = L.latLngBounds(points.map(p=>[p.lat,p.lng]));
    map.fitBounds(b, {padding:[40,40]});
  }
  setTimeout(fixMapSize, 200);
  setTimeout(declutterLabels, 400);
})();
