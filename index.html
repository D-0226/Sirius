<!DOCTYPE html>
<!--
  ============================================================
  FC Sirius 戦績マップ (U7 26年度)
  Revision : 1
  Updated  : 2026-09-11
  ============================================================
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FC Sirius観戦ガイド</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<style>
  :root{
    --paper:#F7F6F2;
    --panel:#FFFFFF;
    --ink:#1F2933;
    --ink-soft:#5A6472;
    --line:#DDD8CB;
    --accent:#C1440E;
    --accent-soft:#F3D9CB;
    --blue:#2B6CB0;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--paper);
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh; /* iOS Safari address-bar resize fix */
    overflow:hidden;
  }
  .load-error{
    padding:24px;
    font-size:13px;
    color:var(--accent);
    line-height:1.6;
  }

  header{
    display:flex;
    align-items:center;
    flex-wrap:nowrap;
    gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    z-index:20;
  }
  header h1{
    font-size:15px;
    font-weight:700;
    letter-spacing:.02em;
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-width:0;
  }
  .header-right{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:1;
    min-width:0;
    max-width:58%;
  }
  header .count{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink-soft);
    white-space:nowrap;
    flex-shrink:1;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .header-toggle{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-size:11px;
    border-radius:4px;
    padding:3px 8px;
    cursor:pointer;
    flex-shrink:0;
  }
  #gradeSelect{
    max-width:84px;
    box-sizing:border-box;
  }
  .header-toggle:hover{ background:var(--paper); }

  /* ===== 観戦ガイド改善UI ===== */
  .guide-strip{
    background:var(--panel); border-bottom:1px solid var(--line); padding:8px 12px;
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; flex-shrink:0; z-index:15;
  }
  .guide-card{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:8px 10px; min-width:0;}
  .guide-card .gc-label{font-size:10px;color:var(--ink-soft);font-weight:700;margin-bottom:3px;}
  .guide-card .gc-main{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .guide-card .gc-sub{font-size:10.5px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .guide-card.next{border-left:4px solid var(--accent);}
  .guide-actions{display:flex;gap:6px;margin-top:5px;}
  .guide-action{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 7px;font-size:10px;cursor:pointer;color:var(--ink);}
  .guide-action:hover{background:var(--paper);}
  .guide-section{padding:7px 12px;background:var(--paper);border-bottom:1px solid var(--line);}
  .guide-section-title{font-size:10px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .recent-list{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;}
  .recent-item{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:105px;cursor:pointer;}
  .recent-item .ri-top{font-size:10px;color:var(--ink-soft);}
  .recent-item .ri-team{font-size:11px;font-weight:700;max-width:135px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .recent-item .ri-score{font-family:var(--mono);font-size:11px;margin-top:2px;}
  #internalMatchSection .recent-item{cursor:default;}
  .result-win{color:#16803c}.result-draw{color:#9a6b00}.result-lose{color:#c43b2f}
  .guide-search{padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);}
  .guide-search #mapSearchInput{padding:10px 12px;border-radius:9px;font-size:13px;}
  /* 凡例は右上の「凡例」ボタンから表示するため、地図上の常設凡例は全方向で非表示 */
  .map-quick-help{display:none;}
  .popup-actions{display:flex;gap:6px;margin-top:8px;}
  .popup-action{display:inline-block;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:11px;color:var(--ink);background:#fff;}
  .popup-action.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .ground-info{margin-top:7px;padding:7px 8px;background:#f7f7f4;border:1px solid var(--line);border-radius:7px;}
  .ground-info-row{display:flex;gap:6px;align-items:flex-start;margin:3px 0;font-size:11px;line-height:1.45;}
  .ground-info-label{flex:0 0 58px;color:var(--ink-soft);font-size:10px;font-weight:700;}
  .accuracy-badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:800;color:#fff;vertical-align:middle;}
  .accuracy-A{background:#16803c}.accuracy-B{background:#3578a8}.accuracy-C{background:#9a6b00}.accuracy-D{background:#777}
  .accuracy-desc{margin-left:4px;color:var(--ink-soft);}
  .ground-source{font-size:10px;color:var(--ink-soft);margin-top:5px;}
  .ground-source a{color:var(--blue);text-decoration:none;}
  .ground-source a:hover{text-decoration:underline;}
  .search-result-item .sr-type{font-size:9px;color:var(--ink-soft);font-weight:700;}
  .match-summary{display:flex;gap:5px;margin:6px 0 2px;}
  .match-stat{flex:1;text-align:center;border:1px solid var(--line);border-radius:6px;padding:5px 2px;background:#fff;}
  .match-stat b{display:block;font-size:13px}.match-stat span{font-size:9px;color:var(--ink-soft);}
  .mobile-search-btn,.mobile-search-panel{display:none;}
  .ground-quick{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 2px;}
  .ground-chip{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 7px;font-size:10px;color:var(--ink-soft);}
  .ground-chip b{color:var(--ink);}
  @media(max-width:600px){
    /* スマホでは検索欄を地図上のボタンへ移し、地図高さを最大化 */
    .guide-strip{grid-template-columns:1fr 1fr;padding:5px 8px;gap:5px;}
    .guide-card:first-child{grid-column:auto;}
    .guide-card{padding:5px 7px;border-radius:7px;}
    .guide-card .gc-label{font-size:9px;margin-bottom:1px;}
    .guide-card .gc-main{font-size:12px;line-height:1.25;}
    .guide-card .gc-sub{font-size:9px;margin-top:1px;}
    .guide-section{padding:5px 8px;}
    .guide-search{display:none;}
    .map-quick-help{bottom:8px;left:8px;font-size:9px;}
    .mobile-search-btn{
      display:flex;position:absolute;left:8px;bottom:44px;z-index:1000;
      align-items:center;justify-content:center;gap:4px;
      border:1px solid var(--line);background:rgba(255,255,255,.96);
      border-radius:8px;padding:7px 10px;font-size:11px;font-weight:600;
      color:var(--ink);box-shadow:0 2px 5px rgba(0,0,0,.16);
    }
    .mobile-search-panel{
      position:absolute;left:8px;right:8px;bottom:88px;z-index:1200;
      background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:9px;
      padding:7px;box-shadow:0 4px 14px rgba(0,0,0,.2);
    }
    .mobile-search-panel.open{display:block;}
    .mobile-search-panel #mapSearchInputMobile{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;}
    .mobile-search-panel .search-results{position:static;width:100%;max-height:48vh;margin-top:5px;}
    .mobile-search-panel{bottom:88px;}
    .mobile-search-close{position:absolute;right:12px;top:12px;border:0;background:transparent;font-size:16px;color:var(--ink-soft);}
  }

  /* スマホ横向き：上部検索欄を隠し、地図上の検索ボタンを表示 */
  @media (orientation: landscape) and (max-height: 600px){
    .guide-search{display:none;}
    .mobile-search-btn{
      display:flex;
      position:absolute;
      left:8px;
      bottom:12px;
      z-index:1100;
    }
    .mobile-search-panel{bottom:54px;z-index:1200;}
    /* 凡例は「凡例」ボタンから表示するため、地図上の常設凡例は隠す */
    .map-quick-help{display:none;}
  }

  .legend-search{
    position:relative;
    padding:10px 20px 0;
    background:var(--paper);
  }
  #mapSearchInput{
    width:100%;
    box-sizing:border-box;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:13px;
    font-family:var(--sans);
    background:var(--panel);
    color:var(--ink);
  }
  #mapSearchInput:focus{ outline:2px solid var(--blue); outline-offset:-1px; }
  .search-results{
    display:none;
    position:fixed;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    overflow-y:auto;
    z-index:2000;
  }
  .search-results.show{ display:block; }
  .search-result-item{
    display:flex;
    flex-direction:column;
    gap:1px;
    padding:8px 10px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .search-result-item:last-child{ border-bottom:none; }
  .search-result-item:hover{ background:var(--paper); }
  .search-result-item .sr-name{ font-size:13px; font-weight:600; color:var(--ink); }
  .search-result-item .sr-sub{ font-size:11px; color:var(--ink-soft); }
  .search-empty{ padding:10px; font-size:12.5px; color:var(--ink-soft); text-align:center; }

  .legend-bar{
    display:flex;
    flex-wrap:wrap;
    gap:6px 18px;
    padding:8px 20px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    z-index:20;
  }
  .legend-item{
    display:flex;
    align-items:baseline;
    gap:6px;
    font-size:11.5px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .legend-item[data-filter]{
    cursor:pointer;
    padding:3px 8px;
    border-radius:99px;
    border:1px solid transparent;
    transition:background .12s, border-color .12s;
  }
  .legend-item[data-filter]:hover{
    background:var(--panel);
    border-color:var(--line);
  }
  .legend-item[data-filter].active-filter{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .legend-item b{
    color:var(--ink);
    font-weight:700;
  }
  .legend-item .lcount{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:3px;
    padding:0 5px;
  }

  .layout{
    flex:1;
    display:flex;
    min-height:0;
  }

  .map-wrap{
    flex:1;
    min-height:0;
    position:relative;
    width:100%;
  }

  .section{
    padding:16px 18px;
    border-bottom:1px solid var(--line);
  }
  .section-title{
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 10px 0;
  }
  .section-title.collapsible{
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    user-select:none;
    margin:0;
    padding-bottom:10px;
  }
  .section-title.collapsible .chev{
    font-size:10px;
    transition:transform .15s ease;
  }
  .collapsible-body{
    overflow:hidden;
  }
  .collapsible-body.collapsed{
    display:none;
  }
  #legendBody{
    overflow:visible; /* 検索結果ドロップダウンが枠内でクリップされないようにする */
  }

  /* add point form */
  .row{ display:flex; gap:8px; margin-bottom:8px; }
  .row input{ flex:1; min-width:0; }
  label.field{
    display:block;
    font-size:10px;
    color:var(--ink-soft);
    margin-bottom:3px;
    font-family:var(--mono);
  }
  input[type=text], input[type=number]{
    width:100%;
    padding:7px 8px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:13px;
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
  }
  input:focus{ outline:2px solid var(--blue); outline-offset:-1px; }

  .btn{
    appearance:none;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    font-size:12.5px;
    font-weight:600;
    padding:8px 12px;
    border-radius:4px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .btn:hover{ background:var(--paper); }
  .btn:focus-visible{ outline:2px solid var(--blue); outline-offset:1px; }
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn-primary:hover{ background:#a83a0c; }
  .btn-primary.active{
    background:#8f3309;
    box-shadow: inset 0 0 0 2px #ffffff55;
  }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); padding:6px 8px;}
  .btn-ghost:hover{ background:var(--paper); color:var(--ink); }
  .btn-block{ width:100%; justify-content:center; }
  .btn-sm{ padding:6px 10px; font-size:11px; min-height:30px; }

  .hint{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:6px;
    line-height:1.5;
  }

  /* layer switcher */
  .pillgroup{ display:flex; gap:6px; flex-wrap:wrap; }
  .pill{
    font-size:12px;
    padding:8px 12px;
    border-radius:99px;
    border:1px solid var(--line);
    background:var(--paper);
    cursor:pointer;
    color:var(--ink-soft);
  }
  .pill.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
    font-weight:600;
  }

  /* points list */
  .list-wrap{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  .list-scroll{
    flex:1;
    overflow-y:auto;
    padding:6px 10px calc(14px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch;
  }
  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:12.5px;
    padding:26px 10px;
    line-height:1.6;
  }
  .list-group-title{
    font-size:11px;
    font-weight:700;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin:12px 4px 4px;
  }
  .list-group-title:first-child{ margin-top:2px; }
  .point-card{
    border:1px solid var(--line);
    border-radius:6px;
    margin:6px 2px;
    background:var(--panel);
    overflow:hidden;
  }
  .point-card.selected{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .point-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    cursor:pointer;
  }
  .swatch{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    flex-shrink:0;
  }
  .point-name{
    font-size:13px;
    font-weight:600;
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .point-coords{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
    padding:0 10px 8px 28px;
  }
  .point-actions{
    display:flex;
    gap:4px;
    padding:0 8px 8px 28px;
  }
  .point-edit{
    padding:8px 10px 10px;
    background:var(--paper);
    border-top:1px solid var(--line);
    display:none;
  }
  .point-edit.open{ display:block; }
  .point-edit .row{ margin-bottom:6px; }
  .point-edit .row:last-child{ margin-bottom:0; margin-top:8px; justify-content:flex-end; }

  .badge{
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-soft);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:3px;
    padding:1px 5px;
    flex-shrink:0;
  }

  .match-section{
    margin-top:10px;
    padding-top:8px;
    border-top:1px solid var(--line);
  }
  .match-section .section-title{ margin-bottom:6px; }
  .match-list{
    max-height:150px;
    overflow-y:auto;
    margin-bottom:6px;
  }
  .match-row{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    padding:4px 2px;
    border-bottom:1px dashed var(--line);
  }
  .match-row:last-child{ border-bottom:none; }
  .match-row span{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .match-row .mscore{ font-family:var(--mono); flex:0 0 auto; }
  .match-row .mresult{ flex:0 0 auto; font-weight:700; }
  .match-empty{ font-size:11.5px; color:var(--ink-soft); padding:4px 2px; }
  select{
    width:100%;
    padding:7px 8px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:13px;
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
  }

  /* import/export */
  textarea{
    width:100%;
    min-height:70px;
    resize:vertical;
    font-family:var(--mono);
    font-size:11.5px;
    padding:8px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--paper);
    color:var(--ink);
  }
  .io-actions{ display:flex; gap:8px; margin-top:8px; }
  .io-actions .btn{ flex:1; }

  /* ---------- map ---------- */
  #map{ width:100%; height:100%; background:#e8e6de; min-width:0; }

  .leaflet-popup-content{ font-family:var(--sans); font-size:13px; }
  .leaflet-popup-content b{ display:block; margin-bottom:2px; }
  .leaflet-popup-content .pcoord{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); }
  .leaflet-popup-content .precord{
    max-height:130px;
    overflow-y:auto;
    margin-top:6px;
  }
  .leaflet-popup-content .precord-title{ font-weight:700; font-size:11.5px; margin-bottom:2px; }
  .leaflet-popup-content .precord-row{
    display:flex;
    justify-content:space-between;
    gap:8px;
    font-size:11px;
    padding:2px 0;
    border-top:1px solid #eee;
  }
  .leaflet-popup-content .precord-row .pmono{ font-family:var(--mono); }

  .click-banner{
    position:absolute;
    top:12px; left:50%;
    transform:translateX(-50%);
    background:var(--accent);
    color:#fff;
    font-size:12.5px;
    font-weight:600;
    padding:7px 16px;
    border-radius:99px;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
    z-index:1000;
    display:none;
    align-items:center;
    gap:8px;
  }
  .click-banner.show{ display:flex; }

  /* ---------- unified floating map controls ---------- */
  .map-controls{
    position:absolute;
    top:8px;
    right:8px;
    z-index:1000;
    display:flex;
    flex-direction:column;
    gap:4px;
    width:100px;
  }
  .map-ctrl-btn{
    display:flex;
    align-items:center;
    gap:5px;
    width:100%;
    box-sizing:border-box;
    padding:6px 8px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    font-size:11px;
    font-weight:600;
    font-family:var(--sans);
    text-align:left;
    line-height:1.2;
    box-shadow:0 2px 5px rgba(0,0,0,.16);
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .map-ctrl-btn .ico{
    flex-shrink:0;
    font-size:12px;
    width:14px;
    text-align:center;
  }
  .map-ctrl-btn:active{ transform:scale(0.97); }
  .map-ctrl-btn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }
  .ground-mode-hint{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    z-index:1000;display:none;align-items:center;gap:6px;
    background:rgba(255,255,255,.96);border:1px solid var(--line);
    border-radius:99px;padding:6px 10px;font-size:10.5px;font-weight:600;
    color:var(--ink-soft);box-shadow:0 2px 6px rgba(0,0,0,.14);
    pointer-events:none;white-space:nowrap;
  }
  body.ground-mode .ground-mode-hint{display:flex;}
  body.ground-mode .team-label{display:none;}
  body.ground-focus .ground-label{display:none;}
  body.ground-focus .ground-label.ground-label-selected{display:block!important;}
  .ground-mode-hint{cursor:pointer;pointer-events:auto;}
  .ground-label.ground-label-selected{
    background:rgba(255,255,255,.97)!important;border:1px solid var(--ink)!important;
    border-radius:6px!important;padding:2px 5px!important;font-weight:700!important;
    box-shadow:0 2px 6px rgba(0,0,0,.18);
  }
  .leaflet-popup.ground-popup .leaflet-popup-content-wrapper{max-height:min(68vh,520px);overflow:hidden;}
  .leaflet-popup.ground-popup .leaflet-popup-content{max-height:min(64vh,480px);overflow-y:auto;-webkit-overflow-scrolling:touch;}
  @media(max-width:600px){
    .ground-mode-hint{top:6px;font-size:10px;padding:5px 9px;}
    .leaflet-popup.ground-popup .leaflet-popup-content-wrapper{max-height:62vh;}
    .leaflet-popup.ground-popup .leaflet-popup-content{max-height:58vh;}
  }

  .leaflet-tooltip.name-label{
    display:none;
    background:rgba(255,255,255,.92);
    border:1px solid var(--line);
    border-radius:3px;
    padding:1px 6px;
    font-size:10.5px;
    font-family:var(--sans);
    color:var(--ink);
    box-shadow:0 1px 2px rgba(0,0,0,.15);
    white-space:nowrap;
  }
  .leaflet-tooltip.name-label::before{ display:none; }
  body.team-labels-visible .leaflet-tooltip.name-label.team-label{ display:block; }
  body.ground-labels-visible .leaflet-tooltip.name-label.ground-label{ display:block; }

  @media (max-width: 380px){
    .map-controls{ width:86px; }
    .map-ctrl-btn{ font-size:10px; padding:5px 6px; }
    .map-ctrl-btn .ico{ font-size:11px; width:12px; }
  }

  .toast{
    position:absolute;
    bottom:16px; left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    font-size:12.5px;
    padding:8px 16px;
    border-radius:6px;
    z-index:1000;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .toast.show{ opacity:1; }

  /* scrollbar */
  .list-scroll::-webkit-scrollbar{ width:8px; }
  .list-scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  .grade-overlay-toggle{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#475569;white-space:nowrap;cursor:pointer;user-select:none;}
  .grade-overlay-toggle input{margin:0;accent-color:#1B4B66;}
  .other-grade-badge{font-size:9px;color:#64748B;margin-left:2px;}

  /* very narrow phones: keep header compact and on one line */
  @media (max-width: 380px){
    header h1{ font-size:13px; }
    .header-right{ gap:4px; }
    header .count{ font-size:10.5px; }
    #gradeSelect{ font-size:10.5px; padding:3px 4px; max-width:64px; }
    .header-toggle{ font-size:10px; padding:3px 6px; }
  }
</style>
</head>
<body>

<header>
  <h1>FC Sirius観戦ガイド</h1>
  <div class="header-right">
    <span class="count" id="countLabel">0 地点</span>
    <select id="gradeSelect" class="header-toggle" style="cursor:pointer;"></select>
    <label class="grade-overlay-toggle" title="選択学年以外の対戦チーム・会場も地図に表示">
      <input type="checkbox" id="otherGradeToggle">
      <span>他学年も表示</span>
    </label>
  </div>
</header>

<div class="guide-strip" id="guideStrip">
  <div class="guide-card">
    <div class="gc-label">対戦チーム</div>
    <div class="gc-main" id="teamCountMain">-</div>
    <div class="gc-sub" id="teamCountSub">表示学年</div>
  </div>
  <div class="guide-card">
    <div class="gc-label">今季の戦績</div>
    <div class="gc-main" id="overallRecordMain">-</div>
    <div class="gc-sub" id="overallRecordSub">表示学年の全対戦</div>
  </div>
</div>
<div class="guide-search">
  <input type="text" id="mapSearchInput" placeholder="🔍 チーム名・会場・住所で検索" autocomplete="off">
  <div id="mapSearchResults" class="search-results"></div>
</div>
<div class="collapsible-body collapsed" id="legendBody">
<div class="legend-search" style="display:none"></div>
<div class="legend-bar">
  <span class="legend-item" data-filter="green">🟢 勝率100%（全勝）</span>
  <span class="legend-item" data-filter="yellow">🟡 勝率60%〜99%</span>
  <span class="legend-item" data-filter="orange">🟠 勝率30%〜59%</span>
  <span class="legend-item" data-filter="red">🔴 勝率30%未満</span>
  <span class="legend-item" data-filter="skull">💀 全敗（勝ちなし・分けなし）</span>
  <span class="legend-item"><span style="display:inline-block;width:11px;height:11px;background:#1B4B66;border-radius:3px;vertical-align:-1px;"></span> ⚽ グラウンド（試合会場）</span>
</div>
</div>

<div class="layout">
  

  <div class="map-wrap">
    <div class="map-controls">
      <button class="map-ctrl-btn" id="btnCycleTileLayer" title="背景地図の切替"><span class="ico">🗺️</span><span class="lbl">淡色地図</span></button>
      <button class="map-ctrl-btn" id="btnToggleTeamLabels" title="チーム名の表示/非表示"><span class="ico">🏷️</span><span class="lbl">チーム名</span></button>
      <button class="map-ctrl-btn active" id="btnToggleGroundsVisible" title="グラウンドの表示/非表示"><span class="ico">⚽</span><span class="lbl">グラウンド</span></button>
      <button class="map-ctrl-btn" id="btnToggleGroundLabels" title="グラウンド名の表示/非表示"><span class="ico">🚩</span><span class="lbl">会場名</span></button>
      <button class="map-ctrl-btn" id="btnHeaderToggle" data-collapse-toggle data-target="legendBody" title="凡例・絞り込みの表示/非表示"><span class="ico">☰</span><span class="lbl">凡例</span></button>
    </div>
    <button class="ground-mode-hint" id="groundModeHint" type="button">⚽ 会場をタップすると観戦情報を表示</button>
    <button class="mobile-search-btn" id="mobileSearchBtn" type="button">🔍 検索</button>
    <div class="mobile-search-panel" id="mobileSearchPanel">
      <button class="mobile-search-close" id="mobileSearchClose" type="button" aria-label="検索を閉じる">×</button>
      <input type="text" id="mapSearchInputMobile" placeholder="チーム名・会場・住所" autocomplete="off">
      <div id="mapSearchResultsMobile" class="search-results"></div>
    </div>
    <div id="map"></div>
    <div class="map-quick-help">🟢勝率高　🟠要注意　🔴勝率低　⚽会場</div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script src="app-core1.js" defer></script><script src="app-core2.js" defer></script><script src="app-data.js" defer></script><script src="app-ui.js" defer></script></body>
</html>
